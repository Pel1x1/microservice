# ПР10: Promtail находит контейнеры сервисов через Docker API и отправляет их stdout в Loki.
# Сервисы пишут логи в stdout в формате JSON (app/observability.py), файлы логов не нужны.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: automarket
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: [logging=promtail]     # только контейнеры восьми сервисов
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            level: level
            ts: timestamp
      - labels:
          level:                 # индексируется только уровень; trace_id ищется по содержимому
      - timestamp:
          source: ts
          format: RFC3339Nano
