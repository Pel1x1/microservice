# ПР10: Prometheus опрашивает /metrics всех восьми сервисов и RabbitMQ (модель pull)
global:
  scrape_interval: 5s       # в учебном стенде чаще, чем 15s из методички: графики видны сразу
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: automarket
    metrics_path: /metrics
    static_configs:
      - targets:
          - user-service:80
          - store-service:80
          - catalog-service:80
          - inventory-service:80
          - order-service:80
          - payment-service:80
          - delivery-service:80
          - review-service:80
    relabel_configs:
      # метка service=order-service вместо адреса order-service:80
      - source_labels: [__address__]
        regex: '([a-z-]+):\d+'
        target_label: service

  - job_name: rabbitmq
    metrics_path: /metrics/per-object   # метрики по каждой очереди
    static_configs:
      - targets: [rabbitmq:15692]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
