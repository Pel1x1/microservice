# Маркетплейс автозапчастей: восемь микросервисов (user, store, catalog, inventory, order, payment, delivery, review)
# Запуск: docker compose up --build
# База данных на каждый сервис (database per service), общий брокер RabbitMQ
x-postgres: &postgres
  image: postgres:16
  environment:
    POSTGRES_PASSWORD: password
  healthcheck:
    test: pg_isready -U postgres
    interval: 5s
    timeout: 5s
    retries: 10

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - 5672:5672       # AMQP
      - 15672:15672     # веб-интерфейс (guest / guest)
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10

  inventory-db:
    <<: *postgres
    volumes:
      - inventory_data:/var/lib/postgresql/data

  order-db:
    <<: *postgres
    volumes:
      - order_data:/var/lib/postgresql/data

  inventory-service:
    build: ./inventory-service
    ports:
      - 8001:80
    environment:
      POSTGRES_URL: postgresql://postgres:password@inventory-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      inventory-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    build: ./order-service
    ports:
      - 8002:80
    environment:
      POSTGRES_URL: postgresql://postgres:password@order-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      INVENTORY_URL: http://inventory-service:80
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-service:
        condition: service_started

  user-db:
    <<: *postgres
    volumes:
      - user_data:/var/lib/postgresql/data

  user-service:
    build: ./user-service
    ports:
      - 8003:80
    environment:
      POSTGRES_URL: postgresql://postgres:password@user-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  store-db:
    <<: *postgres
    volumes:
      - store_data:/var/lib/postgresql/data

  store-service:
    build: ./store-service
    ports:
      - 8004:80
    environment:
      POSTGRES_URL: postgresql://postgres:password@store-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      store-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog-db:
    <<: *postgres
    volumes:
      - catalog_data:/var/lib/postgresql/data

  catalog-service:
    build: ./catalog-service
    ports:
      - 8005:80
    environment:
      POSTGRES_URL: postgresql://postgres:password@catalog-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      STORE_URL: http://store-service:80
    depends_on:
      catalog-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      store-service:
        condition: service_started

  payment-db:
    <<: *postgres
    volumes:
      - payment_data:/var/lib/postgresql/data

  payment-service:
    build: ./payment-service
    ports:
      - 8006:80
    environment:
      POSTGRES_URL: postgresql://postgres:password@payment-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  delivery-db:
    <<: *postgres
    volumes:
      - delivery_data:/var/lib/postgresql/data

  delivery-service:
    build: ./delivery-service
    ports:
      - 8007:80
    environment:
      POSTGRES_URL: postgresql://postgres:password@delivery-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      delivery-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  review-db:
    <<: *postgres
    volumes:
      - review_data:/var/lib/postgresql/data

  review-service:
    build: ./review-service
    ports:
      - 8008:80
    environment:
      POSTGRES_URL: postgresql://postgres:password@review-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      ORDER_URL: http://order-service:80
    depends_on:
      review-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      order-service:
        condition: service_started

volumes:
  inventory_data:
  order_data:
  user_data:
  store_data:
  catalog_data:
  payment_data:
  delivery_data:
  review_data:
