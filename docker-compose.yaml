# Маркетплейс автозапчастей: восемь микросервисов (user, store, catalog, inventory, order, payment, delivery, review)
# Запуск: docker compose up --build
# База данных на каждый сервис (database per service), общий брокер RabbitMQ.
# ПР10: Prometheus + Grafana (метрики), Loki + Promtail (логи), Jaeger (трассировка).
x-postgres: &postgres
  image: postgres:16
  environment:
    POSTGRES_PASSWORD: password
  healthcheck:
    test: pg_isready -U postgres
    interval: 5s
    timeout: 5s
    retries: 10

# Общее для всех восьми сервисов
x-service: &service
  labels:
    logging: promtail          # Promtail собирает логи только с контейнеров с этой меткой
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health', timeout=3)"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 10s

x-observability-env: &observability-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  ENVIRONMENT: docker-compose
  LOG_LEVEL: INFO

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - 5672:5672       # AMQP
      - 15672:15672     # веб-интерфейс (guest / guest)
    healthcheck:
      # ping отвечает раньше, чем открыт порт AMQP; проверяем, что порт принимает соединения
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10

  inventory-db:
    <<: *postgres
    volumes:
      - inventory_data:/var/lib/postgresql/data

  order-db:
    <<: *postgres
    volumes:
      - order_data:/var/lib/postgresql/data

  inventory-service:
    <<: *service
    build: ./inventory-service
    image: automarket/inventory-service:latest
    ports:
      - 8001:80
    environment:
      <<: *observability-env
      POSTGRES_URL: postgresql://postgres:password@inventory-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      inventory-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    <<: *service
    build: ./order-service
    image: automarket/order-service:latest
    ports:
      - 8002:80
    environment:
      <<: *observability-env
      POSTGRES_URL: postgresql://postgres:password@order-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      INVENTORY_URL: http://inventory-service:80
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-service:
        condition: service_healthy

  user-db:
    <<: *postgres
    volumes:
      - user_data:/var/lib/postgresql/data

  user-service:
    <<: *service
    build: ./user-service
    image: automarket/user-service:latest
    ports:
      - 8003:80
    environment:
      <<: *observability-env
      POSTGRES_URL: postgresql://postgres:password@user-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  store-db:
    <<: *postgres
    volumes:
      - store_data:/var/lib/postgresql/data

  store-service:
    <<: *service
    build: ./store-service
    image: automarket/store-service:latest
    ports:
      - 8004:80
    environment:
      <<: *observability-env
      POSTGRES_URL: postgresql://postgres:password@store-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      store-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog-db:
    <<: *postgres
    volumes:
      - catalog_data:/var/lib/postgresql/data

  catalog-service:
    <<: *service
    build: ./catalog-service
    image: automarket/catalog-service:latest
    ports:
      - 8005:80
    environment:
      <<: *observability-env
      POSTGRES_URL: postgresql://postgres:password@catalog-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      STORE_URL: http://store-service:80
    depends_on:
      catalog-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      store-service:
        condition: service_healthy

  payment-db:
    <<: *postgres
    volumes:
      - payment_data:/var/lib/postgresql/data

  payment-service:
    <<: *service
    build: ./payment-service
    image: automarket/payment-service:latest
    ports:
      - 8006:80
    environment:
      <<: *observability-env
      POSTGRES_URL: postgresql://postgres:password@payment-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  delivery-db:
    <<: *postgres
    volumes:
      - delivery_data:/var/lib/postgresql/data

  delivery-service:
    <<: *service
    build: ./delivery-service
    image: automarket/delivery-service:latest
    ports:
      - 8007:80
    environment:
      <<: *observability-env
      POSTGRES_URL: postgresql://postgres:password@delivery-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      delivery-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  review-db:
    <<: *postgres
    volumes:
      - review_data:/var/lib/postgresql/data

  review-service:
    <<: *service
    build: ./review-service
    image: automarket/review-service:latest
    ports:
      - 8008:80
    environment:
      <<: *observability-env
      POSTGRES_URL: postgresql://postgres:password@review-db:5432/postgres
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      ORDER_URL: http://order-service:80
    depends_on:
      review-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      order-service:
        condition: service_healthy

  # ---------- ПР10: наблюдаемость ----------
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - ${PROMETHEUS_PORT:-9090}:9090   # порт на хосте можно сменить, если 9090 занят
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro

  loki:
    image: grafana/loki:3.5.3
    ports:
      - 3100:3100
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.5.3
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # обнаружение контейнеров и чтение их stdout
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    ports:
      - 16686:16686     # веб-интерфейс Jaeger
      - 4317:4317       # приём по OTLP/gRPC
      - 4318:4318       # приём по OTLP/HTTP (используют сервисы)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - ${GRAFANA_PORT:-3000}:3000      # порт на хосте можно сменить, если 3000 занят
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"          # учебный стенд: вход без пароля
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/automarket.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  inventory_data:
  order_data:
  user_data:
  store_data:
  catalog_data:
  payment_data:
  delivery_data:
  review_data:
